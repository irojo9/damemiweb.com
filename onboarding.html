<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Completa tu pedido · Dame mi Web</title>
<meta name="robots" content="noindex, nofollow"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap');
:root{
  --bg:#f4f6fb;--white:#fff;--bd:#e2e6f0;--tx:#1a1c2e;--mt:#6b6e8a;--dm:#b0b4cc;
  --acc:#5b6ef5;--acc2:#4355e8;--ok:#22c87a;--err:#f04060;--warn:#f5a020;
  --sh:0 2px 16px rgba(0,0,0,.07);--sh2:0 6px 32px rgba(0,0,0,.1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;font-size:16px}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.hdr{background:var(--white);border-bottom:1px solid var(--bd);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;color:var(--tx)}
.logo em{font-style:normal;color:var(--acc)}
.hdr-badge{font-size:12px;color:var(--mt);background:var(--bg);padding:5px 12px;border-radius:20px;border:1px solid var(--bd);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 80px}
.prog-bar{height:4px;background:var(--bd);border-radius:2px;margin-bottom:22px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--acc),#8b9ff8);border-radius:2px;transition:width .4s ease}
.steps{display:flex;align-items:center;justify-content:center;margin-bottom:24px;gap:0}
.st{display:flex;align-items:center;gap:6px}
.st-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;transition:all .3s}
.st-num.done{background:var(--ok);color:#fff}
.st-num.act{background:var(--acc);color:#fff;box-shadow:0 0 0 4px rgba(91,110,245,.2)}
.st-num.pend{background:var(--bd);color:var(--mt)}
.st-lbl{font-size:11px;font-weight:600;color:var(--mt);white-space:nowrap}
.st-lbl.act{color:var(--acc)}.st-lbl.done{color:var(--ok)}
.st-line{flex:1;height:2px;background:var(--bd);margin:0 4px;min-width:14px}
.st-line.done{background:var(--ok)}
.card{background:var(--white);border:1px solid var(--bd);border-radius:18px;padding:22px 20px;box-shadow:var(--sh);margin-bottom:14px}
.card-icon{font-size:36px;margin-bottom:10px;display:block}
.card-title{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.4px;margin-bottom:5px;line-height:1.2}
.card-sub{font-size:14px;color:var(--mt);margin-bottom:22px;line-height:1.6}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:12px;font-weight:600;color:var(--mt);text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{border:2px solid var(--bd);border-radius:12px;padding:13px 14px;font-size:16px;font-family:'DM Sans',sans-serif;color:var(--tx);background:var(--white);outline:none;transition:border-color .18s,box-shadow .18s;width:100%;appearance:none;-webkit-appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,110,245,.12)}
.field textarea{resize:none;min-height:100px;line-height:1.6}
.field .hint{font-size:12px;color:var(--dm)}
.field input.err,.field textarea.err{border-color:var(--err);box-shadow:0 0 0 3px rgba(240,64,96,.1)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:400px){.frow{grid-template-columns:1fr}}
/* PRODUCTO */
.prod-card{border:2px solid var(--bd);border-radius:14px;padding:16px;cursor:pointer;transition:all .2s;user-select:none;-webkit-user-select:none;margin-bottom:10px;position:relative}
.prod-card:active{transform:scale(.98)}
.prod-card.sel{border-color:var(--acc);background:rgba(91,110,245,.04)}
.prod-qty{display:flex;align-items:center;gap:10px;margin-top:10px}
.qty-btn{width:36px;height:36px;border-radius:10px;border:2px solid var(--bd);background:var(--white);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;font-weight:700}
.qty-btn:hover{border-color:var(--acc);color:var(--acc)}
.qty-num{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;min-width:28px;text-align:center}
.desc-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;background:rgba(34,200,122,.12);color:#15803d;font-size:12px;font-weight:700;margin-top:6px}
.total-box{background:linear-gradient(135deg,rgba(91,110,245,.07),rgba(139,159,248,.04));border:2px solid rgba(91,110,245,.2);border-radius:16px;padding:16px;text-align:center;margin-bottom:16px}
.total-importe{font-family:'Syne',sans-serif;font-size:38px;font-weight:800;letter-spacing:-2px;color:var(--acc);line-height:1}
.total-desc{font-size:12px;color:var(--mt);margin-top:4px}
/* PAGO */
.metodos{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.metodo{display:flex;align-items:center;gap:14px;padding:15px 16px;border:2px solid var(--bd);border-radius:14px;background:var(--white);cursor:pointer;transition:all .2s;user-select:none;-webkit-user-select:none}
.metodo:active{transform:scale(.98)}
.metodo.sel{border-color:var(--acc);background:rgba(91,110,245,.05)}
.m-icon{font-size:26px;width:40px;text-align:center;flex-shrink:0}
.m-info{flex:1}
.m-info strong{font-size:15px;font-weight:600;display:block}
.m-info span{font-size:13px;color:var(--mt)}
.m-radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);flex-shrink:0;transition:all .2s;position:relative}
.metodo.sel .m-radio{border-color:var(--acc);background:var(--acc)}
.metodo.sel .m-radio::after{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;top:50%;left:50%;transform:translate(-50%,-50%)}
.pago-instruc{background:rgba(91,110,245,.06);border:1px solid rgba(91,110,245,.15);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.8;margin-bottom:12px}
.pago-instruc strong{color:var(--tx)}
.pago-copy{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--acc);color:var(--acc);font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;background:transparent}
.pago-copy:hover{background:rgba(91,110,245,.06)}
.aviso{display:flex;align-items:flex-start;gap:9px;padding:12px 14px;background:rgba(245,160,32,.08);border:1px solid rgba(245,160,32,.25);border-radius:10px;font-size:13px;color:#7a5010;margin-bottom:14px;line-height:1.5}
/* COLORES */
.colores-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.color-btn{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:20px;border:2px solid var(--bd);background:var(--white);font-size:14px;cursor:pointer;transition:all .18s;font-family:'DM Sans',sans-serif;-webkit-user-select:none}
.color-btn.sel{border-color:var(--acc);background:rgba(91,110,245,.08);color:var(--acc);font-weight:600}
.cdot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.1);flex-shrink:0}
/* CONTACT */
.contact-opt{display:flex;align-items:center;gap:14px;padding:15px 16px;border:2px solid var(--bd);border-radius:14px;background:var(--white);cursor:pointer;transition:all .2s;margin-bottom:10px}
.contact-opt.sel{border-color:var(--ok);background:rgba(34,200,122,.04)}
.contact-opt .c-radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);flex-shrink:0;transition:all .2s;position:relative}
.contact-opt.sel .c-radio{border-color:var(--ok);background:var(--ok)}
.contact-opt.sel .c-radio::after{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;top:50%;left:50%;transform:translate(-50%,-50%)}
/* BTN */
.btn-main{width:100%;padding:16px;border-radius:14px;background:var(--acc);color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:16px;border:none;cursor:pointer;transition:all .2s;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-main:hover{background:var(--acc2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(91,110,245,.3)}
.btn-main:active{transform:translateY(0)}
.btn-main:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-back{background:none;border:none;color:var(--mt);font-size:14px;cursor:pointer;padding:4px 0;font-family:'DM Sans',sans-serif;margin-bottom:14px;display:flex;align-items:center;gap:5px}
/* SUCCESS */
.success{text-align:center;padding:30px 10px}
.s-ico{font-size:64px;margin-bottom:16px}
.s-t{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.5px;margin-bottom:8px}
.s-sub{font-size:15px;color:var(--mt);line-height:1.7}
/* INVALID */
.invalid{text-align:center;padding:60px 20px}
.invalid-ico{font-size:56px;margin-bottom:16px}
.invalid-t{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:8px}
.invalid-s{color:var(--mt);font-size:14px;line-height:1.7}
.loader{text-align:center;padding:80px 20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.spin{width:36px;height:36px;border:3px solid var(--bd);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="hdr">
  <div class="logo">Dame mi <em>Web</em></div>
  <div class="hdr-badge" id="hdr-nombre">Cargando...</div>
</div>
<div class="wrap" id="root">
  <div class="loader"><div class="spin"></div><div style="font-size:13px;color:var(--mt)">Cargando tu formulario...</div></div>
</div>
<script>
const API = 'https://oficina-ia-api.ivanrojobermejo.workers.dev';
// Escapa datos dinámicos antes de inyectarlos en innerHTML/atributos (anti-XSS)
function esc(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
const _qs = new URLSearchParams(location.search).get('token');
const _path = location.pathname.split('/onboarding/')[1]?.split('/')[0]?.split('?')[0];
const token = _qs || _path || null;

let tokenData = null;
let step = 1; // 1=datos, 2=productos, 3=pago, 4=web, 5=enviado
let pagoMetodo = null;
let coloresSel = [];
let contactoMetodo = null;
let fd = {};
let numWebs = 1;

const PRECIO_WEB = 150; // €+IVA por web
const COLORES = [
  {l:'Azul',h:'#3b82f6'},{l:'Verde',h:'#22c55e'},{l:'Rojo',h:'#ef4444'},
  {l:'Naranja',h:'#f97316'},{l:'Morado',h:'#8b5cf6'},{l:'Rosa',h:'#ec4899'},
  {l:'Negro',h:'#1f2937'},{l:'Dorado',h:'#d97706'},{l:'Turquesa',h:'#06b6d4'},
];

function calcPrecio(n) {
  let base = PRECIO_WEB * n;
  let pct = 0;
  if (n >= 5) pct = 20;
  else if (n >= 3) pct = 15;
  const dto = base * pct / 100;
  return { base, dto, total: base - dto, pct, n };
}

async function init() {
  if (!token) { renderInvalid(); return; }
  try {
    const res = await fetch(`${API}/api/onboarding/${token}`);
    if (!res.ok) { renderInvalid(); return; }
    const data = await res.json();
    tokenData = data.token;
    // Detect mode: 'actualizacion' or 'proyecto' = skip payment steps
    const tipo = tokenData.tipo || 'nuevo';
    window._onbTipo = tipo;
    
    const nombreMostrar = data.cliente 
      ? (data.cliente.empresa || data.cliente.nombre || tokenData.nombre_proyecto || 'Dame mi Web')
      : (tokenData.nombre_proyecto || 'Dame mi Web');
    document.getElementById('hdr-nombre').textContent = nombreMostrar;
    
    if (data.cliente) {
      const cl = data.cliente;
      if (!fd.nombre && cl.nombre) fd.nombre = cl.nombre;
      if (!fd.empresa && cl.empresa) fd.empresa = cl.empresa;
      if (!fd.nombre_legal && cl.nombre_legal) fd.nombre_legal = cl.nombre_legal;
      if (!fd.telefono && cl.telefono) fd.telefono = cl.telefono;
      if (!fd.email && cl.email) fd.email = cl.email;
      if (!fd.nif && cl.nif) fd.nif = cl.nif;
      if (!fd.calle && cl.calle) fd.calle = cl.calle;
      if (!fd.cp && cl.cp) fd.cp = cl.cp;
      if (!fd.localidad && cl.localidad) fd.localidad = cl.localidad;
      if (!fd.provincia && cl.provincia) fd.provincia = cl.provincia;
      // backward compat: old combined direccion → localidad
      if (!fd.localidad && !fd.calle && cl.direccion) fd.localidad = cl.direccion;
      if (!fd.profesion && cl.profesion) fd.profesion = cl.profesion;
      if (!fd.fecha_nacimiento && cl.fecha_nacimiento) fd.fecha_nacimiento = cl.fecha_nacimiento;
    }
    if (data.submission) {
      const s = data.submission;
      if (!fd.dominio && s.dominio) fd.dominio = s.dominio;
      if (!fd.descripcion_servicios && s.descripcion_servicios) fd.descripcion_servicios = s.descripcion_servicios;
      if (!fd.seo_zonas && s.seo_zonas) fd.seo_zonas = s.seo_zonas;
      if (!fd.seo_cliente_ideal && s.seo_cliente_ideal) fd.seo_cliente_ideal = s.seo_cliente_ideal;
      if (!fd.seo_keywords && s.seo_keywords) fd.seo_keywords = s.seo_keywords;
      if (!fd.colores && s.colores) fd.colores = s.colores;
    }
    // Dominio acordado al generar el enlace: prefijado y de solo lectura para el cliente
    if (!fd.dominio && tokenData.dominio) fd.dominio = tokenData.dominio;
    if (tokenData.completado) { step = 5; }
    render();
  } catch(e) { renderInvalid(); }
}

function pct() { return {1:30, 4:80, 5:100}[step] || 10; }

function renderSteps() {
  const tipo = window._onbTipo || 'nuevo';
  let ss;
  if (tipo === 'proyecto') {
    ss = [{n:4,l:'Tu proyecto'}];
  } else {
    // All types: just Datos + Web (no prices, no payment)
    ss = [{n:1,l:'Tus datos'},{n:4,l:'Tu web'}];
  }
  return `<div class="steps">${ss.map((s,i)=>`
    <div class="st">
      <div class="st-num ${step>s.n?'done':step===s.n?'act':'pend'}">${step>s.n?'✓':s.n}</div>
      <div class="st-lbl ${step>s.n?'done':step===s.n?'act':''}">${s.l}</div>
    </div>
    ${i<ss.length-1?`<div class="st-line ${step>s.n?'done':''}"></div>`:''}`).join('')}
  </div>`;
}

function render() {
  const root = document.getElementById('root');
  if (step === 5) { root.innerHTML = renderSuccess(); return; }
  const tipo = window._onbTipo || 'nuevo';

  // Steps 2 (productos/precios) y 3 (pago) eliminados para todos los tipos
  if (step === 2 || step === 3) { step = 4; }

  let content;
  if (tipo === 'actualizacion') {
    content = step === 1 ? renderDatosActualizacion() : renderWeb();
  } else if (tipo === 'proyecto') {
    step = 4;
    content = renderWeb();
  } else {
    content = step === 1 ? renderDatos() : renderWeb();
  }

  root.innerHTML = `
    <div class="prog-bar"><div class="prog-fill" style="width:${pct()}%"></div></div>
    ${renderSteps()}
    ${content}
  `;
  restoreColores();
}

/* ── STEP 1: DATOS ── */
function renderDatosActualizacion() {
  return `<div class="card">
    <span class="card-icon">👋</span>
    <div class="card-title">Confirma tus datos</div>
    <div class="card-sub">Revisa y completa tus datos. Solo tarda 2 minutos.</div>
    <div class="field"><label>Nombre *</label><input id="d-nombre" type="text" placeholder="Cómo te llamamos" value="${esc(fd.nombre||'')}" autocomplete="name"></div>
    <div class="field"><label>Empresa / Negocio</label><input id="d-empresa" type="text" placeholder="Nombre de tu empresa o negocio" value="${esc(fd.empresa||'')}" autocomplete="organization"></div>
    <div class="field"><label>Nombre legal (para facturas)</label><input id="d-nombre-legal" type="text" placeholder="Nombre o razón social en el DNI/CIF" value="${esc(fd.nombre_legal||'')}"><span class="hint">Si coincide con el nombre anterior, déjalo en blanco</span></div>
    <div class="frow">
      <div class="field"><label>Teléfono *</label><input id="d-tel" type="tel" placeholder="600 000 000" value="${esc(fd.telefono||'')}" autocomplete="tel"></div>
      <div class="field"><label>Email *</label><input id="d-email" type="email" placeholder="tu@email.com" value="${esc(fd.email||'')}" autocomplete="email"></div>
    </div>
    <div class="field"><label>NIF / DNI</label><input id="d-nif" type="text" placeholder="12345678A" value="${esc(fd.nif||'')}"></div>
    <div class="field"><label>Calle / Dirección</label><input id="d-calle" type="text" placeholder="Calle Mayor 1, 2º B" value="${esc(fd.calle||'')}" autocomplete="street-address"></div>
    <div class="frow" style="grid-template-columns:110px 1fr">
      <div class="field"><label>Código Postal</label><input id="d-cp" type="text" placeholder="28001" value="${esc(fd.cp||'')}" autocomplete="postal-code" inputmode="numeric" maxlength="5"></div>
      <div class="field"><label>Localidad *</label><input id="d-localidad" type="text" placeholder="Madrid" value="${esc(fd.localidad||'')}" autocomplete="address-level2"></div>
    </div>
    <div class="field"><label>Provincia</label><input id="d-provincia" type="text" placeholder="Madrid" value="${esc(fd.provincia||'')}" autocomplete="address-level1"></div>
    <div class="frow">
      <div class="field"><label>Profesión / Sector</label><input id="d-profesion" type="text" placeholder="Fontanero, Restaurante..." value="${esc(fd.profesion||'')}"></div>
      <div class="field"><label>Fecha de nacimiento</label><input id="d-fnac" type="date" value="${esc(fd.fecha_nacimiento||'')}"></div>
    </div>
    <button class="btn-main" onclick="submitDatosActualizacion()">Continuar → Datos de tu web</button>
  </div>`;
}

function submitDatosActualizacion() {
  const nombre = document.getElementById('d-nombre')?.value?.trim();
  const tel = document.getElementById('d-tel')?.value?.trim();
  const email = document.getElementById('d-email')?.value?.trim();
  const localidad = document.getElementById('d-localidad')?.value?.trim();
  if (!nombre) { hi('d-nombre'); return; }
  if (!tel) { hi('d-tel'); return; }
  if (!email || !email.includes('@')) { hi('d-email'); return; }
  if (!localidad) { hi('d-localidad'); return; }
  fd.nombre=nombre; fd.empresa=document.getElementById('d-empresa')?.value?.trim()||'';
  fd.nombre_legal=document.getElementById('d-nombre-legal')?.value?.trim()||'';
  fd.telefono=tel; fd.email=email;
  fd.nif=document.getElementById('d-nif')?.value?.trim()||'';
  fd.calle=document.getElementById('d-calle')?.value?.trim()||'';
  fd.cp=document.getElementById('d-cp')?.value?.trim()||'';
  fd.localidad=localidad;
  fd.provincia=document.getElementById('d-provincia')?.value?.trim()||'';
  fd.direccion=[fd.calle,fd.cp,fd.localidad,fd.provincia].filter(Boolean).join(', ');
  fd.profesion=document.getElementById('d-profesion')?.value?.trim()||'';
  fd.fecha_nacimiento=document.getElementById('d-fnac')?.value||'';
  savePartial();
  step=4; render();
}


function renderDatos() {
  return `<div class="card">
    <span class="card-icon">👋</span>
    <div class="card-title">¡Hola! Cuéntanos quién eres</div>
    <div class="card-sub">Necesitamos tus datos para preparar tu factura.</div>
    <div class="field"><label>Nombre *</label><input id="d-nombre" type="text" placeholder="Cómo te llamamos" value="${esc(fd.nombre||'')}" autocomplete="name"></div>
    <div class="field"><label>Empresa / Negocio</label><input id="d-empresa" type="text" placeholder="Nombre de tu empresa o negocio" value="${esc(fd.empresa||'')}" autocomplete="organization"></div>
    <div class="field"><label>Nombre legal (para facturas)</label><input id="d-nombre-legal" type="text" placeholder="Nombre o razón social en el DNI/CIF" value="${esc(fd.nombre_legal||'')}"><span class="hint">Si coincide con el nombre anterior, déjalo en blanco</span></div>
    <div class="frow">
      <div class="field"><label>Teléfono *</label><input id="d-tel" type="tel" placeholder="600 000 000" value="${esc(fd.telefono||'')}" autocomplete="tel"></div>
      <div class="field"><label>Email *</label><input id="d-email" type="email" placeholder="tu@email.com" value="${esc(fd.email||'')}" autocomplete="email"></div>
    </div>
    <div class="field"><label>NIF / DNI</label><input id="d-nif" type="text" placeholder="12345678A" value="${esc(fd.nif||'')}"></div>
    <div class="field"><label>Calle / Dirección</label><input id="d-calle" type="text" placeholder="Calle Mayor 1, 2º B" value="${esc(fd.calle||'')}" autocomplete="street-address"></div>
    <div class="frow" style="grid-template-columns:110px 1fr">

/* ── FUNCTIONS ── */
function selMetodo(m) {
  pagoMetodo = m;
  render();
}

function toggleColor(label, el) {
  const idx = coloresSel.indexOf(label);
  if (idx >= 0) { coloresSel.splice(idx,1); el.classList.remove('sel'); }
  else { coloresSel.push(label); el.classList.add('sel'); }
}

function restoreColores() {
  if (step===4 && fd.colores) {
    try { coloresSel = JSON.parse(fd.colores); }
    catch { coloresSel = typeof fd.colores==='string' ? fd.colores.split(',').map(c=>c.trim()) : []; }
  }
}

function copiarIBAN() {
  navigator.clipboard.writeText('ES1615830001139006169025');
  const btn = document.querySelector('.pago-copy');
  if (btn) { btn.textContent = '✅ Copiado'; setTimeout(()=>btn.textContent='📋 Copiar IBAN',2000); }
}

function copiarBizum() {
  navigator.clipboard.writeText('667325691');
  const btn = document.querySelectorAll('.pago-copy')[0];
  if (btn) { btn.textContent = '✅ Copiado'; setTimeout(()=>btn.textContent='📋 Copiar teléfono Bizum',2000); }
}

/* ── SUBMITS ── */
function submitDatos() {
  const nombre = g('d-nombre').trim();
  const tel = g('d-tel').trim();
  const email = g('d-email').trim();
  const localidad = g('d-localidad').trim();
  if (!nombre) { hi('d-nombre'); return; }
  if (!tel) { hi('d-tel'); return; }
  if (!email || !email.includes('@')) { hi('d-email'); return; }
  if (!localidad) { hi('d-localidad'); return; }
  fd.nombre=nombre; fd.empresa=g('d-empresa').trim();
  fd.nombre_legal=g('d-nombre-legal').trim();
  fd.telefono=tel; fd.email=email;
  fd.nif=g('d-nif').trim();
  fd.calle=g('d-calle').trim(); fd.cp=g('d-cp').trim();
  fd.localidad=localidad; fd.provincia=g('d-provincia').trim();
  fd.direccion=[fd.calle,fd.cp,fd.localidad,fd.provincia].filter(Boolean).join(', ');
  fd.profesion=g('d-profesion').trim(); fd.fecha_nacimiento=g('d-fnac');
  fd.quiere_factura=1;
  savePartial();
  step=2; render();
}

function submitProductos() {
  const precio = calcPrecio(numWebs);
  fd.num_webs = numWebs;
  fd.importe = precio.total;
  fd.descuento_pct = precio.pct;
  savePartial();
  step=3; render();
}

function submitPago() {
  if (!pagoMetodo) return;
  fd.metodo_pago=pagoMetodo;
  savePartial();
  step=4; render();
}

async function submitWeb() {
  const dom = g('w-dom').trim();
  const desc = g('w-desc').trim();
  const zonas = g('w-zonas').trim();
  if (!dom) { hi('w-dom'); return; }
  if (!desc) { hi('w-desc'); return; }
  if (!zonas) { hi('w-zonas'); return; }
  const btn = document.getElementById('btn-web');
  if (btn) { btn.disabled=true; btn.textContent='⏳ Enviando...'; }
  fd.dominio=dom; fd.descripcion_servicios=desc;
  fd.colores=JSON.stringify(coloresSel);
  fd.notas_web=g('w-notas').trim();
  fd.seo_zonas=zonas;
  fd.seo_cliente_ideal=g('w-cliente-ideal').trim();
  fd.seo_keywords=g('w-secciones').trim();
  fd.step='completo';
  try {
    const res = await fetch(`${API}/api/onboarding/${token}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fd)});
    if (!res.ok) throw new Error('Error al enviar');
    step=5; render();
  } catch(e) {
    if (btn) { btn.disabled=false; btn.textContent='✅ Enviar toda la información'; }
    alert('Error al enviar. Por favor inténtalo de nuevo.');
  }
}

async function savePartial() {
  try { await fetch(`${API}/api/onboarding/${token}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fd)}); } catch(e){}
}
